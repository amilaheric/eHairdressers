services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ehairdressers_sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backups:/backups
    networks:
      - ehairdressers_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ehairdressers_rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"      
      - "15672:15672"   
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ehairdressers_network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: eHairdressers/Dockerfile
    container_name: ehairdressers_app
    ports:
      - "7051:7051"
    environment:
      - ASPNETCORE_URLS=http://+:7051
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY}
      - RabbitMQ__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - RabbitMQ__VirtualHost=${RABBITMQ_VHOST:-/}
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=eHairdressers
      - Jwt__Audience=eHairdressersClient
      - Jwt__ExpiryMinutes=120

    secrets:
      - stripe_secret_key
      - stripe_webhook_secret
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - ehairdressers_network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: eHairdressers.Worker/Dockerfile
    container_name: ehairdressers_worker
    environment:
      - DOTNET_ENVIRONMENT=Development
      - RabbitMQ__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - RabbitMQ__VirtualHost=${RABBITMQ_VHOST:-/}
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__UseSsl=${SMTP_USE_SSL:-true}
      - Smtp__FromAddress=${SMTP_FROM_ADDRESS:-noreply@ehairdressers.local}
      - Smtp__FromName=eHairdressers
    depends_on:
      - rabbitmq
    networks:
      - ehairdressers_network
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  ehairdressers_network:
    driver: bridge

secrets:
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret.txt

