services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ehairdressers_sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backups:/backups
    networks:
      - ehairdressers_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ehairdressers_rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    ports:
      - "5672:5672"      
      - "15672:15672"   
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ehairdressers_network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: eHairdressers/Dockerfile
    container_name: ehairdressers_app
    ports:
      - "7051:7051"
    environment:
      - ASPNETCORE_URLS=http://+:7051
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=sqlserver;Initial Catalog=IB160064;User ID=sa;Password=Password123!;TrustServerCertificate=True
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123

    secrets:
      - stripe_secret_key
      - stripe_webhook_secret
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - ehairdressers_network
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  ehairdressers_network:
    driver: bridge

secrets:
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret.txt

